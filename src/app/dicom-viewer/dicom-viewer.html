<div class="workstation">

  <header class="toolbar">
    <div class="brand">
      <span class="brand-icon">✚</span>
      <div>
        <h2>DICOM Viewer</h2>
        <small>Medical Imaging</small>
      </div>

    </div>
    <div class="toolset">
      <div class="tool" title="Crosshairs" (click)="activateTool('Crosshairs')"
        [class.active]="activeTool()==='Crosshairs'">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="#ffffff" stroke-width="1.5"
          stroke-linecap="round" stroke-linejoin="miter" stroke="currentColor">
          <g id="SVGRepo_bgCarrier" stroke-width="0"></g>
          <g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g>
          <g id="SVGRepo_iconCarrier">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="18" x2="12" y2="22"></line>
            <line x1="12" y1="2" x2="12" y2="6"></line>
            <line x1="18" y1="12" x2="22" y2="12"></line>
            <line x1="2" y1="12" x2="6" y2="12"></line>
          </g>
        </svg>
      </div>
      <div class="tool" title="Zoom" (click)="activateTool('Zoom')" [class.active]="activeTool()==='Zoom'">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"
          class="size-6">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z" />
        </svg>
      </div>
      <div class="tool" title="Pan" (click)="activateTool('Pan')" [class.active]="activeTool()==='Pan'">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1"
          class="size-6">
          <g id="SVGRepo_bgCarrier"></g>
          <g id="SVGRepo_tracerCarrier"></g>
          <g id="SVGRepo_iconCarrier">
            <path
              d="M12 3L12.3648 2.65803L12 2.26894L11.6352 2.65803L12 3ZM11.5 9C11.5 9.27614 11.7239 9.5 12 9.5C12.2761 9.5 12.5 9.27614 12.5 9H11.5ZM15.3648 5.85803L12.3648 2.65803L11.6352 3.34197L14.6352 6.54197L15.3648 5.85803ZM11.6352 2.65803L8.63523 5.85803L9.36477 6.54197L12.3648 3.34197L11.6352 2.65803ZM11.5 3V9H12.5V3H11.5Z">
            </path>
            <path
              d="M21 12L21.342 12.3648L21.7311 12L21.342 11.6352L21 12ZM15 11.5C14.7239 11.5 14.5 11.7239 14.5 12C14.5 12.2761 14.7239 12.5 15 12.5L15 11.5ZM18.142 15.3648L21.342 12.3648L20.658 11.6352L17.458 14.6352L18.142 15.3648ZM21.342 11.6352L18.142 8.63523L17.458 9.36477L20.658 12.3648L21.342 11.6352ZM21 11.5L15 11.5L15 12.5L21 12.5L21 11.5Z">
            </path>
            <path
              d="M12 21L12.3648 21.342L12 21.7311L11.6352 21.342L12 21ZM11.5 15C11.5 14.7239 11.7239 14.5 12 14.5C12.2761 14.5 12.5 14.7239 12.5 15H11.5ZM15.3648 18.142L12.3648 21.342L11.6352 20.658L14.6352 17.458L15.3648 18.142ZM11.6352 21.342L8.63523 18.142L9.36477 17.458L12.3648 20.658L11.6352 21.342ZM11.5 21V15H12.5V21H11.5Z">
            </path>
            <path
              d="M3 12L2.65803 12.3648L2.26894 12L2.65803 11.6352L3 12ZM9 11.5C9.27614 11.5 9.5 11.7239 9.5 12C9.5 12.2761 9.27614 12.5 9 12.5L9 11.5ZM5.85803 15.3648L2.65803 12.3648L3.34197 11.6352L6.54197 14.6352L5.85803 15.3648ZM2.65803 11.6352L5.85803 8.63523L6.54197 9.36477L3.34197 12.3648L2.65803 11.6352ZM3 11.5L9 11.5L9 12.5L3 12.5L3 11.5Z">
            </path>
          </g>
        </svg>
      </div>

      <div class="tool" title="Window Level" (click)="activateTool('WindowLevel')"
        [class.active]="activeTool()==='WindowLevel'">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" stroke="currentColor" stroke-width="1.5">
          <!-- Outer circle -->
          <circle cx="12" cy="12" r="9" fill="none" />
          <!-- Left half filled -->
          <path d="M12 3 A9 9 0 0 0 12 21 Z" fill="currentColor" stroke="none" />
        </svg>
      </div>

      <div class="tool" title="Rotate Volume" (click)="activateTool('TrackballRotate')"
        [class.active]="activeTool()==='TrackballRotate'">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" xmlns="http://www.w3.org/2000/svg">
          <g id="SVGRepo_bgCarrier" stroke-width="0"></g>
          <g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g>
          <g id="SVGRepo_iconCarrier">
            <path d="M6.70001 9.26001L12 12.33L17.26 9.28001" stroke="currentColor" stroke-width="1.5"
              stroke-linecap="round" stroke-linejoin="round"></path>
            <path d="M12 17.7701V12.3201" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"
              stroke-linejoin="round"></path>
            <path
              d="M10.76 6.28998L7.56 8.06998C6.84 8.46998 6.23999 9.47998 6.23999 10.31V13.7C6.23999 14.53 6.83 15.54 7.56 15.94L10.76 17.72C11.44 18.1 12.56 18.1 13.25 17.72L16.45 15.94C17.17 15.54 17.77 14.53 17.77 13.7V10.3C17.77 9.46998 17.18 8.45998 16.45 8.05998L13.25 6.27998C12.56 5.89998 11.44 5.89998 10.76 6.28998Z"
              stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path>
            <path d="M22 15C22 18.87 18.87 22 15 22L16.05 20.25" stroke="currentColor" stroke-width="1.5"
              stroke-linecap="round" stroke-linejoin="round"></path>
            <path d="M2 9C2 5.13 5.13 2 9 2L7.95001 3.75" stroke="currentColor" stroke-width="1.5"
              stroke-linecap="round" stroke-linejoin="round"></path>
          </g>
        </svg>
      </div>

      <div class="tool" title="Reset Views" (click)="resetViewports()">
        <svg viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor">
          <g id="SVGRepo_bgCarrier" stroke-width="0"></g>
          <g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g>
          <g id="SVGRepo_iconCarrier">
            <path
              d="M17 9a1 1 0 01-1-1c0-.551-.448-1-1-1H5.414l1.293 1.293a.999.999 0 11-1.414 1.414l-3-3a.999.999 0 010-1.414l3-3a.997.997 0 011.414 0 .999.999 0 010 1.414L5.414 5H15c1.654 0 3 1.346 3 3a1 1 0 01-1 1zM3 11a1 1 0 011 1c0 .551.448 1 1 1h9.586l-1.293-1.293a.999.999 0 111.414-1.414l3 3a.999.999 0 010 1.414l-3 3a.999.999 0 11-1.414-1.414L14.586 15H5c-1.654 0-3-1.346-3-3a1 1 0 011-1z"
              fill="none" stroke="currentColor"></path>
          </g>
        </svg>
      </div>
    </div>

  </header>

  <main class="viewer-layout">

    <section class="viewer-panel">
      <div class="panel-header">
        <span>AXIAL</span>
        <small>2D VIEW</small>
      </div>
      <div #axial class="viewport" (contextmenu)="$event.preventDefault()"></div>
    </section>

    <section class="viewer-panel">
      <div class="panel-header">
        <span>3D VOLUME</span>
        <small>3D VIEW</small>
      </div>
      <div #volume3d class="viewport" (contextmenu)="$event.preventDefault()"></div>
    </section>

    <section class="viewer-panel">
      <div class="panel-header">
        <span>CORONAL</span>
        <small>2D VIEW</small>
      </div>
      <div #coronal class="viewport" (contextmenu)="$event.preventDefault()"></div>
    </section>

    <section class="viewer-panel">
      <div class="panel-header">
        <span>SAGITTAL</span>
        <small>2D VIEW</small>
      </div>
      <div #sagittal class="viewport" (contextmenu)="$event.preventDefault()"></div>
    </section>



  </main>

  <footer class="footer">
    <span>{{ dicomStore.fileCount }} file(s) selected</span>
  </footer>

</div>
